name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck and jq are on the runner image. Claude Code is unpinned so
      # that `claude plugin validate` follows the current plugin schema.
      - name: Install just and Claude Code
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just
          npm install -g @anthropic-ai/claude-code
      - run: just check
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
